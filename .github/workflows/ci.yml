name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:protocol
      - name: Verify generated declarations are current
        run: git diff --exit-code -- types/generated lib/protocol/generated.js
      - run: npm test
      - run: npm run test:handles
        env:
          SEN_TEST_EXIT_TIMEOUT_MS: 180000
      - run: npm pack --dry-run
      - run: npm run test:package
      - name: Short stability run
        run: npm run test:soak
        env:
          SEN_SOAK_DURATION_MS: 2000
